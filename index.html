function getProfileKey(V, P, K) {
  const total = V + P + K;
  const vPct = V/total, pPct = P/total, kPct = K/total;
  if (vPct > 0.55) return "V-V-V";
  if (pPct > 0.55) return "P-P-P";
  if (kPct > 0.55) return "K-K-K";
  const ranked = [{d:"V",v:V},{d:"P",v:P},{d:"K",v:K}].sort((a,b)=>b.v-a.v);
  return `${ranked[0].d}-${ranked[1].d}-${ranked[2].d}`;
}

const EmailGate = ({profileTitle, onSubmit, onSkip}) => {
  const [email, setEmail] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState("");

  const handleSubmit = async () => {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) { setError("Please enter a valid email address."); return; }
    setLoading(true); setError("");
    try {
      await fetch(WEBHOOK_URL, {
        method:"POST", headers:{"Content-Type":"application/json"}, mode:"no-cors",
        body: JSON.stringify({email, dosha_result: profileTitle, source:"Bodh Dosha Quiz"}),
      });
    } catch(e) {}
    setLoading(false);
    onSubmit(email);
  };

  return (
    <div style={{minHeight:"100vh",background:C.charcoal,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}}>
      <div style={{maxWidth:480,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:20}}>🌿</div>
        <p style={{fontSize:11,fontWeight:700,letterSpacing:"0.3em",color:C.gold,textTransform:"uppercase",marginBottom:12}}>The Bodh Life</p>
        <h2 style={{fontSize:34,fontWeight:700,color:C.white,lineHeight:1.15,marginBottom:12}}>Your results are ready.</h2>
        <p style={{fontStyle:"italic",fontSize:18,color:"rgba(250,246,240,0.75)",marginBottom:32,lineHeight:1.6}}>
          Enter your email to receive your full <strong style={{color:C.gold}}>{profileTitle}</strong> profile — food, rituals, and hormonal protocol — straight to your inbox.
        </p>
        <input type="email" placeholder="your@email.com" value={email}
          onChange={e=>setEmail(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&handleSubmit()}
          style={{width:"100%",padding:"16px 20px",borderRadius:10,border:`2px solid ${error?C.pitta:"rgba(250,246,240,0.15)"}`,background:"rgba(250,246,240,0.08)",color:C.white,fontSize:17,outline:"none",marginBottom:8}}/>
        {error && <p style={{fontSize:13,color:C.pitta,marginBottom:8}}>{error}</p>}
        <button onClick={handleSubmit} disabled={loading} style={{width:"100%",padding:"17px 0",borderRadius:10,background:loading?C.grey:`linear-gradient(135deg,${C.orange},${C.teal})`,border:"none",color:C.white,fontSize:17,fontWeight:700,letterSpacing:"0.08em",cursor:loading?"not-allowed":"pointer",textTransform:"uppercase",marginBottom:16}}>
          {loading?"Sending...":"Send My Results →"}

        <button onClick={onSkip} style={{background:"none",border:"none",color:"rgba(250,246,240,0.35)",fontSize:13,cursor:"pointer",textDecoration:"underline"}}>
          Skip — just show me my results

      </div>
    </div>
  );
};

function DoshaQuiz() {
  const [step, setStep] = React.useState("intro");
  const [qi, setQi] = React.useState(0);
  const [scores, setScores] = React.useState({V:0,P:0,K:0});
  const [selected, setSelected] = React.useState(null);
  const [animating, setAnimating] = React.useState(false);

  const q = QUESTIONS[qi];

  const handleNext = () => {
    if (!selected || animating) return;
    setAnimating(true);
    const ns = {V:scores.V+selected.V, P:scores.P+selected.P, K:scores.K+selected.K};
    setTimeout(() => {
      setScores(ns); setSelected(null); setAnimating(false);
      if (qi+1 >= QUESTIONS.length) { setStep("email"); } else { setQi(qi+1); }
    }, 280);
  };

  const handleRestart = () => { setStep("intro"); setQi(0); setScores({V:0,P:0,K:0}); setSelected(null); };

  const profileKey = getProfileKey(scores.V, scores.P, scores.K);
  const profile = PROFILES[profileKey] || PROFILES["V-P-K"];
  const maxVal = Math.max(scores.V, scores.P, scores.K);

  if (step === "intro") return (
    <div style={{minHeight:"100vh",background:C.charcoal,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}}>
      <div style={{maxWidth:540,width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:40}}>
          <p style={{fontSize:11,fontWeight:700,letterSpacing:"0.3em",color:C.gold,textTransform:"uppercase",marginBottom:12}}>The Bodh Life</p>
          <h1 style={{fontSize:42,fontWeight:700,color:C.white,lineHeight:1.1,marginBottom:8}}>Know Your<br/><span style={{color:C.orange}}>Prakriti.</span></h1>
          <p style={{fontStyle:"italic",fontSize:20,color:C.cream,opacity:0.85,marginBottom:24}}>Discover your Ayurvedic constitution —<br/>and what it means for your hormones, gut, and mind.</p>
          <div style={{display:"flex",justifyContent:"center",gap:12,marginBottom:32}}>
            {[["🌬","Vata",C.vata],["🔥","Pitta",C.pitta],["🌿","Kapha",C.kapha]].map(([e,d,c])=>(
              <div key={d} style={{background:c+"22",border:`1px solid ${c}44`,borderRadius:12,padding:"12px 18px",textAlign:"center"}}>
                <div style={{fontSize:22}}>{e}</div>
                <div style={{fontSize:12,fontWeight:700,color:c,letterSpacing:"0.1em"}}>{d}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{background:"rgba(250,246,240,0.07)",borderRadius:16,padding:28,border:"1px solid rgba(250,246,240,0.12)",marginBottom:28}}>
          <p style={{color:C.cream,lineHeight:1.7,marginBottom:16,opacity:0.88}}>This 20-question quiz maps your body, mind, digestion, emotions, and sleep to determine your unique tridosha order.</p>
          <p style={{color:C.cream,lineHeight:1.7,opacity:0.7,fontSize:14}}>Answer based on how you've been feeling over the <strong style={{color:C.gold}}>past 3–6 months</strong>. There are no right answers.</p>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:32}}>
          {[["20","Questions"],["7 min","To complete"],["9","Result profiles"]].map(([n,l])=>(
            <div key={l} style={{background:"rgba(250,246,240,0.05)",borderRadius:10,padding:"14px 10px",textAlign:"center",border:"1px solid rgba(250,246,240,0.1)"}}>
              <div style={{fontSize:22,fontWeight:700,color:C.gold}}>{n}</div>
              <div style={{fontSize:11,color:C.cream,opacity:0.6,marginTop:3}}>{l}</div>
            </div>
          ))}
        </div>
        <button onClick={()=>setStep("quiz")} style={{width:"100%",padding:"18px 0",borderRadius:12,background:`linear-gradient(135deg,${C.orange},${C.teal})`,border:"none",color:C.white,fontSize:17,fontWeight:700,letterSpacing:"0.08em",cursor:"pointer",textTransform:"uppercase"}}>
          Discover My Prakriti →
        </button>
        <p style={{textAlign:"center",marginTop:16,fontSize:12,color:C.cream,opacity:0.4}}>Free · Created by @thebodhlife</p>
      </div>
    </div>
  );

  if (step === "quiz") return (
    <div style={{minHeight:"100vh",background:C.cream,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"24px 16px 48px"}}>
      <div style={{maxWidth:580,width:"100%"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <p style={{fontSize:11,fontWeight:700,letterSpacing:"0.2em",color:C.teal,textTransform:"uppercase"}}>The Bodh Life · Prakriti Quiz</p>
          <p style={{fontSize:12,color:C.grey}}>{qi+1} / {QUESTIONS.length}</p>
        </div>
        <ProgressBar current={qi+1} total={QUESTIONS.length}/>
        <div style={{marginBottom:16}}>
          <span style={{display:"inline-block",padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:600,background:CAT_COLORS[q.category]+"22",color:CAT_COLORS[q.category],border:`1px solid ${CAT_COLORS[q.category]}44`}}>{q.category}</span>
        </div>
        <h2 style={{fontSize:24,fontWeight:700,color:C.charcoal,lineHeight:1.35,marginBottom:28}}>{q.q}</h2>
        <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:28}}>
          {q.opts.map((opt,i)=>{
            const isSel = selected===opt;
            return (
              <button key={i} onClick={()=>!animating&&setSelected(opt)} style={{width:"100%",textAlign:"left",padding:"18px 20px",borderRadius:12,border:`2px solid ${isSel?C.teal:"#DDD6CC"}`,background:isSel?C.teal+"15":C.white,cursor:"pointer",transition:"all 0.2s",transform:isSel?"scale(1.01)":"scale(1)"}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:14}}>
                  <div style={{width:22,height:22,borderRadius:"50%",flexShrink:0,marginTop:1,border:`2px solid ${isSel?C.teal:"#BBB"}`,background:isSel?C.teal:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    {isSel&&<div style={{width:8,height:8,borderRadius:"50%",background:C.white}}/>}
                  </div>
                  <p style={{margin:0,fontSize:16,lineHeight:1.5,color:isSel?C.charcoal:"#5a4a38",fontWeight:isSel?500:400}}>{opt.label}</p>
                </div>
              </button>
            );
          })}
        </div>
        <button onClick={handleNext} disabled={!selected} style={{width:"100%",padding:"16px 0",borderRadius:12,background:selected?C.teal:"#C8BFAF",border:"none",color:C.white,fontSize:16,fontWeight:700,letterSpacing:"0.06em",cursor:selected?"pointer":"not-allowed",transition:"background 0.2s",textTransform:"uppercase"}}>
          {qi+1===QUESTIONS.length?"See My Results →":"Next Question →"}
        </button>
        {qi>0&&<button onClick={()=>{setQi(qi-1);setSelected(null);}} style={{display:"block",margin:"16px auto 0",background:"none",border:"none",color:C.grey,fontSize:13,cursor:"pointer"}}>← Back</button>}
      </div>
    </div>
  );

  if (step === "email") return (
    <EmailGate profileTitle={profile.title} onSubmit={()=>setStep("result")} onSkip={()=>setStep("result")}/>
  );

  return (
    <div style={{minHeight:"100vh",background:C.cream,padding:"0 0 60px"}}>
      <div style={{background:profile.color,padding:"48px 24px 36px",textAlign:"center"}}>
        <p style={{fontSize:11,fontWeight:700,letterSpacing:"0.28em",color:"rgba(255,255,255,0.65)",textTransform:"uppercase",marginBottom:10}}>Your Prakriti · The Bodh Life</p>
        <h1 style={{fontSize:48,fontWeight:700,color:C.white,lineHeight:1,marginBottom:6}}>{profile.title}</h1>
        <p style={{fontStyle:"italic",fontSize:22,color:"rgba(255,255,255,0.82)",marginBottom:16}}>{profile.subtitle}</p>
        <p style={{fontSize:17,color:"rgba(255,255,255,0.9)",lineHeight:1.6,maxWidth:440,margin:"0 auto"}}>"{profile.tagline}"</p>
      </div>
      <div style={{maxWidth:600,margin:"0 auto",padding:"0 16px"}}>
        <div style={{background:C.white,borderRadius:16,padding:24,margin:"24px 0 16px",boxShadow:"0 2px 12px rgba(44,24,16,0.06)"}}>
          <p style={{fontSize:12,fontWeight:700,letterSpacing:"0.16em",color:C.grey,textTransform:"uppercase",marginBottom:18}}>Your Tridosha Balance</p>
          <DoshaBar label="VATA (Air + Space)" value={scores.V} max={maxVal} color={C.vata}/>
          <DoshaBar label="PITTA (Fire + Water)" value={scores.P} max={maxVal} color={C.pitta}/>
          <DoshaBar label="KAPHA (Earth + Water)" value={scores.K} max={maxVal} color={C.kapha}/>
        </div>
        <Section icon="🌿" title="Your Constitution" borderColor={profile.color}>
          <p style={{fontSize:16,color:C.charcoal,lineHeight:1.75}}>{profile.summary}</p>
        </Section>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          <div style={{background:C.teal+"12",borderRadius:12,padding:18,border:`1px solid ${C.teal}33`}}>
            <p style={{fontSize:11,fontWeight:700,letterSpacing:"0.14em",color:C.teal,textTransform:"uppercase",marginBottom:12}}>Your Gifts</p>
            {profile.strengths.map((s,i)=>(
              <p key={i} style={{fontSize:14,color:C.charcoal,lineHeight:1.5,marginBottom:8,paddingLeft:14,position:"relative"}}>
                <span style={{position:"absolute",left:0,color:C.teal}}>◉</span>{s}
              </p>
            ))}
          </div>
          <div style={{background:C.pitta+"10",borderRadius:12,padding:18,border:`1px solid ${C.pitta}33`}}>
            <p style={{fontSize:11,fontWeight:700,letterSpacing:"0.14em",color:C.pitta,textTransform:"uppercase",marginBottom:12}}>Watch For</p>
            {profile.challenges.map((s,i)=>(
              <p key={i} style={{fontSize:14,color:C.charcoal,lineHeight:1.5,marginBottom:8,paddingLeft:14,position:"relative"}}>
                <span style={{position:"absolute",left:0,color:C.pitta}}>▲</span>{s}
              </p>
            ))}
          </div>
        </div>
        <Section icon="🫙" title="What to Eat" borderColor={C.orange}>
          {profile.food.map((f,i)=>(
            <div key={i} style={{display:"flex",gap:10,marginBottom:12,alignItems:"flex-start"}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:C.orange,marginTop:7,flexShrink:0}}/>
              <p style={{fontSize:15,color:C.charcoal,lineHeight:1.6,margin:0}}>{f}</p>
            </div>
          ))}
        </Section>
        <Section icon="🌙" title="Daily Rituals" borderColor={C.teal}>
          {profile.rituals.map((r,i)=>(
            <div key={i} style={{display:"flex",gap:10,marginBottom:12,alignItems:"flex-start"}}>
              <div style={{width:24,height:24,borderRadius:"50%",flexShrink:0,background:C.teal,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span style={{color:C.white,fontSize:11,fontWeight:700}}>{i+1}</span>
              </div>
              <p style={{fontSize:15,color:C.charcoal,lineHeight:1.6,margin:0}}>{r}</p>
            </div>
          ))}
        </Section>
        <Section icon="🍂" title="Your Critical Season" borderColor={C.gold}>
          <p style={{fontSize:15,color:C.charcoal,lineHeight:1.7}}>{profile.season}</p>
        </Section>
        <Section icon="🩺" title="For Your Hormones" borderColor="#9C5AB5">
          <p style={{fontSize:15,color:C.charcoal,lineHeight:1.75}}>{profile.hormoneNote}</p>
          <div style={{marginTop:14,padding:14,background:"#9C5AB511",borderRadius:8,border:"1px solid #9C5AB533"}}>
            <p style={{fontSize:13,color:C.grey,lineHeight:1.6,margin:0}}>This is an educational guide, not a clinical diagnosis. For a full Ayurvedic assessment, work with a qualified practitioner.</p>
          </div>
        </Section>
        <div style={{background:C.charcoal,borderRadius:16,padding:28,textAlign:"center",marginBottom:16}}>
          <p style={{fontSize:11,fontWeight:700,letterSpacing:"0.2em",color:C.gold,textTransform:"uppercase",marginBottom:12}}>Want to go deeper?</p>
          <p style={{fontSize:18,color:C.white,lineHeight:1.6,marginBottom:20}}>Follow <strong style={{color:C.orange}}>@thebodhlife</strong> for weekly Ayurvedic food, rituals, and ingredient deep-dives — built for your dosha.</p>
          <p style={{fontStyle:"italic",fontSize:15,color:C.cream,opacity:0.65,marginBottom:24}}>Live with awareness. Heal with intention.</p>
          <button onClick={handleRestart} style={{padding:"14px 36px",borderRadius:10,background:"transparent",border:`2px solid ${C.orange}`,color:C.orange,fontSize:14,fontWeight:700,cursor:"pointer",letterSpacing:"0.06em",textTransform:"uppercase"}}>
            Retake the Quiz
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<DoshaQuiz/>, document.getElementById('root'));
</script>
</body>
</html>
